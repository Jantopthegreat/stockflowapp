
services:
  db:
    image: postgres:17-alpine
    container_name: stockflow-postgres

    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: stockflow_user
      POSTGRES_PASSWORD: stockflow_password

    ports:
      - "5433:5432"

    volumes:
      - stockflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
      
  migrate:
    image: migrate/migrate:v4.20.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://stockflow_user:stockflow_password@db:5432/stockflow?sslmode=disable"
      - "up"
    restart: "no"
volumes:
  stockflow_postgres_data:


